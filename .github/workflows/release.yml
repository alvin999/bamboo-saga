name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '🎋 廣零散 (bamboo-saga) ${{ github.ref_name }}'
          releaseBody: |
            ## 🎋 廣零散 (bamboo-saga) ${{ github.ref_name }}
            
            > **「廣納零散思緒，一帖 AI 成丹。」**
            > *Scatter thoughts on bamboo slips; forge an immortal saga with AI.*
            
            ### ✨ 本次更新亮點 (Highlights)
            * 🪄 **意圖煉丹爐介面按鈕型態重構 (Alchemy Furnace Action Button Refinement)**：
              - 丹方列表全面實體按鈕化，新增醒目立體的「🪄 套用效果」按鈕，懸停時綻放金光能量反饋，直覺呈現點擊施法預期。
              - 智慧指示連動：輸入單次補充指令時，按鈕動態切換為「套用 (+指示)」，因果關聯清晰明瞭。
              - 專屬圖示導引：依丹方屬性智能配置核心符號（結構化結論、待辦矩陣、代碼補正與自訂心法）。
            * 🛡️ **全方位操作防誤觸機制 (Misclick Prevention)**：
              - 卡片本體改為純展示容器（不可點擊），僅右側實體按鈕可啟動 AI，徹底根除滑動瀏覽時的誤觸疑慮。
              - 心法設定（Prompt 編修）與刪除工具弱化至右上角獨立按鈕，主要執行心流不受干擾。
            * 🧱 **型別架構與丹方色標系統升級 (TypeScript & Alchemy Color Scheme)**：
              - 擴充 `AlchemyColorTag` 型別系統，完整支援朱砂赤、黃赭石、竹墨綠、青金藍、紫晶檀 5 大經典色標與自訂擴充。
              - 元件 Props 結構統一規範化，強化編譯期相容性與系統穩定度。

            ### 📥 各平台安裝說明 (Installation Guide)
            * **🪟 Windows (10 / 11)**：下載最新版 `bamboo-saga_*_x64-setup.exe` 雙擊安裝。若遇 SmartScreen 提示，點擊「其他資訊」➔「仍要執行」即可。
            * **🍎 macOS (Apple Silicon)**：下載 `.dmg` 拖入 Applications。首次開啟若被擋下，請至「系統設定 ➔ 隱私權與安全性」點擊「強制打開」，或執行 `xattr -cr /Applications/bamboo-saga.app`。
            * **🐧 Linux (所有發行版)**：
              * **AppImage (免安裝最推薦)**：`chmod +x *.AppImage && ./*.AppImage`
              * **Debian / Ubuntu**：`sudo dpkg -i *.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
