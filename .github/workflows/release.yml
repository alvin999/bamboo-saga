name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '🎋 廣零散 (bamboo-saga) ${{ github.ref_name }}'
          releaseBody: |
            ## 🎋 廣零散 (bamboo-saga) ${{ github.ref_name }}
            
            > **「廣納零散思緒，一帖 AI 成丹。」**
            > *Scatter thoughts on bamboo slips; forge an immortal saga with AI.*
            
            ### ✨ 本次更新亮點 (Highlights)
            * 🎨 **暗房暖炭低疲勞美學 (Warm Charcoal Darkroom)**：全面優化全域色彩系統，採用極致溫潤的暖炭黑底與琥珀金微光；柔化 CodeMirror 6 語法高亮對比度，大幅緩解長時間撰寫手稿的眼部疲勞。
            * 🛠️ **多功能文字工具箱排版升級 (Text Tools Modal)**：擴大視窗呼吸感與行間距，重塑雙欄 Diff 比對視圖與清洗工具排列，精簡徽章干擾，提供更純粹的文字處理體驗。
            * 🔄 **在線升級雷達 (Release Radar)**：於「系統設定」分頁正式整合 GitHub Releases 即時更新檢查器，一鍵掌握最新版本動態與跨平台發佈資訊。
            * 🛡️ **Windows NSIS 輕量封裝**：Windows 發行版本全面採用現代化 NSIS 獨立安裝程式，免除 UAC 權限困擾，隨開隨用更流暢。
            * ☁️ **全平台 OneDrive 備份完善**：持續強化跨平台（Windows / macOS / Linux）雲端自動鏡像備份之穩固性。

            ### 📥 各平台安裝說明 (Installation Guide)
            * **🪟 Windows (10 / 11)**：下載最新版 `bamboo-saga_*_x64-setup.exe` 雙擊安裝。若遇 SmartScreen 提示，點擊「其他資訊」➔「仍要執行」即可。
            * **🍎 macOS (Apple Silicon)**：下載 `.dmg` 拖入 Applications。首次開啟若被擋下，請至「系統設定 ➔ 隱私權與安全性」點擊「強制打開」，或執行 `xattr -cr /Applications/bamboo-saga.app`。
            * **🐧 Linux (所有發行版)**：
              * **AppImage (免安裝最推薦)**：`chmod +x *.AppImage && ./*.AppImage`
              * **Debian / Ubuntu**：`sudo dpkg -i *.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
