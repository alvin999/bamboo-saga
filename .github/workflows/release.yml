name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '🎋 廣零散 (bamboo-saga) ${{ github.ref_name }}'
          releaseBody: |
            ## 🎋 廣零散 (bamboo-saga) ${{ github.ref_name }}
            
            > **「廣納零散思緒，一帖 AI 成丹。」**
            > *Scatter thoughts on bamboo slips; forge an immortal saga with AI.*
            
            ### ✨ 本次更新亮點 (Highlights)
            * ⌨️ **跨平台 Vim 模式無視中文輸入法（Zed-like IME Auto-suspend）**：
              - **Linux (Arch Hyprland / Ubuntu / WebKitGTK)**：在 Normal / Visual 模式下底層動態掛起 WebKitGTK 輸入法上下文，完美相容 Wayland text-input-v3，徹底解決 fcitx5 與 IBus 在 hjkl 移動或下指令時誤寫注音問題。
              - **Windows (10 / 11)**：透過 Win32 IMM32 API 於 Normal 模式自動切換為英數，返回 Insert 模式時自動記憶並還原中文狀態。
              - **macOS**：整合 Carbon HIToolbox，切換模式自動協調 ASCII 輸入源與中文還原。
              - **極簡靜默體驗**：拿除多餘的告警提示 Toast，底層安靜攔截未消費之組字輸入，心流不中斷。
              - **偏好設定重構**：更新為 `imeAutoSwitch`「Vim 模式自動暫停中文輸入法」。
            * 🔍 **延續 v0.1.5 全新竹風尋卷條與替換中樞 (Find & Replace)**：
              - 浮動膠囊面板、動態序號計數、單筆替換與批次取代全數穩定運作。

            ### 📥 各平台安裝說明 (Installation Guide)
            * **🪟 Windows (10 / 11)**：下載最新版 `bamboo-saga_*_x64-setup.exe` 雙擊安裝。若遇 SmartScreen 提示，點擊「其他資訊」➔「仍要執行」即可。
            * **🍎 macOS (Apple Silicon)**：下載 `.dmg` 拖入 Applications。首次開啟若被擋下，請至「系統設定 ➔ 隱私權與安全性」點擊「強制打開」，或執行 `xattr -cr /Applications/bamboo-saga.app`。
            * **🐧 Linux (所有發行版)**：
              * **AppImage (免安裝最推薦)**：`chmod +x *.AppImage && ./*.AppImage`
              * **Debian / Ubuntu**：`sudo dpkg -i *.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
