name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '🎋 廣零散 (bamboo-saga) ${{ github.ref_name }}'
          releaseBody: |
            ## 🎋 廣零散 (bamboo-saga) ${{ github.ref_name }}
            
            > **「廣納零散思緒，一帖 AI 成丹。」**
            > *Scatter thoughts on bamboo slips; forge an immortal saga with AI.*
            
            ### ✨ 本次更新亮點 (Highlights)
            * 🎨 **百子櫃東方工藝與現代通透呼吸感 (Apothecary Gruvbox UI Redesign)**：全站彈窗（命令中樞、模糊搜尋、歷史時間軸、文字工具箱、全功能設定中樞）全面重塑，導入高通透毛玻璃、琥珀金動態指示條、去框化鍵位徽章與寬鬆單行清單排版。
            * 🛡️ **原生資源回收桶與安全覆蓋快照 (Native Recycle Bin & Safe Backups)**：檔案刪除直通作業系統資源回收桶（Windows / macOS / Linux 原生橋接），避免手滑誤刪；覆蓋存檔前自動保留安全快照。
            * 📑 **輕量雙向維基連結與中鍵分頁手勢 (Wikilinks & Tab Gestures)**：全面支援 `[[雙括號]]` 即時自動補全與 Ctrl+Click 跳轉，分頁標籤支援滑鼠中鍵極速關閉。
            * ⚙️ **膠囊式全功能設定中樞 (Capsule Settings Hub)**：將 API 金鑰庫、按鍵偏好、版面配置、OneDrive 與跨平台系統整合重塑為現代膠囊分頁，操作直覺靈動。
            * ⚡ **雙引擎 AI 煉丹與機敏隱私防護 (Sanitizer Guard)**：完善純本機憑證保險庫持久化（OS Native DPAPI / Web Crypto），雲端 AI 傳送前自動脫敏保護。

            ### 📥 各平台安裝說明 (Installation Guide)
            * **🪟 Windows (10 / 11)**：下載最新版 `bamboo-saga_*_x64-setup.exe` 雙擊安裝。若遇 SmartScreen 提示，點擊「其他資訊」➔「仍要執行」即可。
            * **🍎 macOS (Apple Silicon)**：下載 `.dmg` 拖入 Applications。首次開啟若被擋下，請至「系統設定 ➔ 隱私權與安全性」點擊「強制打開」，或執行 `xattr -cr /Applications/bamboo-saga.app`。
            * **🐧 Linux (所有發行版)**：
              * **AppImage (免安裝最推薦)**：`chmod +x *.AppImage && ./*.AppImage`
              * **Debian / Ubuntu**：`sudo dpkg -i *.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
