name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '🎋 廣零散 (bamboo-saga) ${{ github.ref_name }}'
          releaseBody: |
            ## 🎋 廣零散 (bamboo-saga) ${{ github.ref_name }}
            
            > **「廣納零散思緒，一帖 AI 成丹。」**
            > *Scatter thoughts on bamboo slips; forge an immortal saga with AI.*
            
            ### ✨ 本次更新亮點 (Highlights)
            * 🔍 **全新竹風尋卷條 (Zen-styled Find & Search Bar)**：
              - 專屬浮動膠囊面板：右上角半透明竹炭黑毛玻璃與沉香琥珀金微光邊框，完美融入竹風包浩斯設計風格。
              - 動態序號徽章：即時統計「當前序號 / 總相符數」（如 `3 / 12`），無相符時動態警示。
              - 雙向折返告警：搜尋抵達文末或文首循環時，自動觸發「🔁 已重新從頭開始搜尋（折返至第 1 筆）」與「🔁 已折返至手稿末尾」Toast 提示。
              - 解除官方限制之高對比相符高亮：自主打造 `bambooSearchHighlighter` 外掛，全篇匹配項目半透明琥珀標記，當前選中項綻放耀眼金光光暈。
            * 📝 **靈動替換支援 (Find & Replace with Smooth Expand)**：
              - 可折疊雙層面板：支援左側箭頭按鈕隨時展開/收折替換為輸入框，或直接以 `Ctrl+H` 隨時喚起替換。
              - 單筆與批次取代：支援 Enter 單筆替換並流暢跳轉下一個，Alt+Enter 全部取代並即時統計回報更換筆數。
            * ⚙️ **Vim 快捷鍵衝突覆蓋擴充 (Vim Key Overrides)**：
              - 偏好設定新增「Ctrl+H 替換」開關，兼顧資深 Vim 使用者之原生退格刪字習慣與現代 GUI 編輯心流。

            ### 📥 各平台安裝說明 (Installation Guide)
            * **🪟 Windows (10 / 11)**：下載最新版 `bamboo-saga_*_x64-setup.exe` 雙擊安裝。若遇 SmartScreen 提示，點擊「其他資訊」➔「仍要執行」即可。
            * **🍎 macOS (Apple Silicon)**：下載 `.dmg` 拖入 Applications。首次開啟若被擋下，請至「系統設定 ➔ 隱私權與安全性」點擊「強制打開」，或執行 `xattr -cr /Applications/bamboo-saga.app`。
            * **🐧 Linux (所有發行版)**：
              * **AppImage (免安裝最推薦)**：`chmod +x *.AppImage && ./*.AppImage`
              * **Debian / Ubuntu**：`sudo dpkg -i *.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
