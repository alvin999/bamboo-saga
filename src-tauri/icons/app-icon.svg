<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景底座漸層：深墨碳玉 -->
    <linearGradient id="d_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262927" />
      <stop offset="100%" stop-color="#111312" />
    </linearGradient>

    <!-- 構成竹色漸層 (汝窯青至竹綠) -->
    <linearGradient id="d_green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9c97b" />
      <stop offset="50%" stop-color="#7da869" />
      <stop offset="100%" stop-color="#4e7845" />
    </linearGradient>

    <!-- 簡冊代碼片漸層 -->
    <linearGradient id="d_slat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ec07c" />
      <stop offset="100%" stop-color="#c5e088" />
    </linearGradient>

    <!-- 赭金節點漸層 -->
    <linearGradient id="d_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed678" />
      <stop offset="60%" stop-color="#d49b35" />
      <stop offset="100%" stop-color="#a26d18" />
    </linearGradient>

    <!-- 投影 -->
    <filter id="d_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 應用程式底座容器 (Squircle 圓角方底) -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#d_bg)" stroke="#3e3930" stroke-width="3" filter="url(#d_shadow)" />
  
  <!-- 構成主義幾何背景網格 -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#fabd2f" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="16 12" />
  <line x1="90" y1="256" x2="422" y2="256" stroke="#484236" stroke-width="1.5" stroke-dasharray="8 8" stroke-opacity="0.4" />
  <line x1="256" y1="90" x2="256" y2="422" stroke="#484236" stroke-width="1.5" stroke-dasharray="8 8" stroke-opacity="0.4" />

  <!-- 主視覺：無葉極簡款（垂直置中優化，放大至 1.18 比例） -->
  <g transform="translate(256, 256) scale(1.18) translate(-272, -256)">
    <!-- 左側主竹骨 (幾何倒角結構，三節立挺) -->
    <rect x="156" y="132" width="32" height="72" rx="6" fill="url(#d_green)" />
    <rect x="156" y="216" width="32" height="80" rx="6" fill="url(#d_green)" />
    <rect x="156" y="308" width="32" height="72" rx="6" fill="url(#d_green)" />

    <!-- 幾何金石竹節橫閂 (金屬鎖環) -->
    <rect x="144" y="204" width="56" height="12" rx="3" fill="url(#d_gold)" />
    <rect x="144" y="296" width="56" height="12" rx="3" fill="url(#d_gold)" />

    <!-- 右側展開之幾何竹簡代碼片 (極簡現代工程感) -->
    
    <!-- 第 1 片簡冊 (頂部代碼行) -->
    <g>
      <rect x="210" y="152" width="176" height="34" rx="5" fill="url(#d_slat)" opacity="0.9" />
      <!-- 代碼幾何槽口與金屬端子 -->
      <rect x="226" y="163" width="50" height="12" rx="3" fill="#141715" />
      <rect x="284" y="163" width="32" height="12" rx="3" fill="#141715" />
      <rect x="324" y="163" width="50" height="12" rx="3" fill="url(#d_gold)" />
      <!-- 金色連綴線 -->
      <line x1="188" y1="169" x2="210" y2="169" stroke="url(#d_gold)" stroke-width="3.5" stroke-dasharray="3 3" />
    </g>

    <!-- 第 2 片簡冊 (中央主力展開，形成長度 `<` 符號張力) -->
    <g>
      <rect x="210" y="210" width="216" height="38" rx="5" fill="url(#d_slat)" opacity="0.98" />
      <!-- 代碼槽口 -->
      <rect x="226" y="222" width="70" height="14" rx="3" fill="#141715" />
      <rect x="306" y="222" width="52" height="14" rx="3" fill="#141715" />
      <rect x="368" y="222" width="26" height="14" rx="3" fill="url(#d_gold)" />
      <!-- 丹火幾何小晶片 (橙色亮點，象徵智慧核心) -->
      <circle cx="410" cy="229" r="6" fill="#fe8019" />
      <line x1="188" y1="229" x2="210" y2="229" stroke="url(#d_gold)" stroke-width="3.5" stroke-dasharray="3 3" />
    </g>

    <!-- 第 3 片簡冊 (底部平衡行) -->
    <g>
      <rect x="210" y="270" width="164" height="34" rx="5" fill="url(#d_slat)" opacity="0.88" />
      <!-- 代碼槽口 -->
      <rect x="226" y="281" width="82" height="12" rx="3" fill="#141715" />
      <rect x="316" y="281" width="46" height="12" rx="3" fill="url(#d_gold)" />
      <line x1="188" y1="287" x2="210" y2="287" stroke="url(#d_gold)" stroke-width="3.5" stroke-dasharray="3 3" />
    </g>
  </g>
</svg>
