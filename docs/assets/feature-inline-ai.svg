<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" style="background: transparent; font-family: ui-monospace, 'Cascadia Code', 'Fira Code', 'Noto Sans TC', system-ui, sans-serif;">
  <defs>
    <!-- 背景漸層 (Gruvbox 深度暗底) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2021" />
      <stop offset="50%" stop-color="#282828" />
      <stop offset="100%" stop-color="#1d2021" />
    </linearGradient>

    <!-- 浮動卡片漸層 -->
    <linearGradient id="promptCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282828" />
      <stop offset="100%" stop-color="#1d2021" />
    </linearGradient>

    <!-- 懸浮陰影 -->
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- ==================== 專案正統 Bamboo 圖標庫 ==================== -->
    <symbol id="bamboo-icon" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#282828"/>
      <path d="M26 12 L26 52 M38 12 L38 52" stroke="#b8bb26" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M22 24 C28 22 34 22 42 24 M22 40 C28 38 34 38 42 40" stroke="#fabd2f" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="26" cy="24" r="3.2" fill="#fe8019"/>
      <circle cx="38" cy="40" r="3.2" fill="#fe8019"/>
      <path d="M38 20 Q48 16 46 28 Q40 26 38 20 Z" fill="#b8bb26" opacity="0.9"/>
      <path d="M26 36 Q16 32 18 44 Q24 42 26 36 Z" fill="#b8bb26" opacity="0.9"/>
    </symbol>

    <symbol id="bamboo-mark" viewBox="0 0 64 64">
      <path d="M26 12 L26 52 M38 12 L38 52" stroke="#b8bb26" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M22 24 C28 22 34 22 42 24 M22 40 C28 38 34 38 42 40" stroke="#fabd2f" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="26" cy="24" r="3.2" fill="#fe8019"/>
      <circle cx="38" cy="40" r="3.2" fill="#fe8019"/>
      <path d="M38 20 Q48 16 46 28 Q40 26 38 20 Z" fill="#b8bb26" opacity="0.9"/>
      <path d="M26 36 Q16 32 18 44 Q24 42 26 36 Z" fill="#b8bb26" opacity="0.9"/>
    </symbol>

    <style>
      /* ==================== 8.5 秒極速時序 (純 Opacity，絕不跑位) ==================== */
      /*
         0s ~ 1.2s : 階段 1 - 編輯器第 13-15 行被選取高光，游標移向快捷提示 Ctrl+K
         1.2s ~ 3.6s: 階段 2 - 浮現 Inline AI 卡片，游標點擊「程式碼重構」標籤與 Enter 按鈕
         3.6s ~ 7.4s: 階段 3 - ★【原地修改對比生效】原本代碼瞬間原地置換為強型別 TypeScript！
         7.4s ~ 8.5s: 循環淡出
      */

      /* 浮動提詞卡片顯示控制 */
      @keyframes promptCardAnim {
        0%, 12% { opacity: 0; visibility: hidden; }
        15%, 44% { opacity: 1; visibility: visible; }
        48%, 100% { opacity: 0; visibility: hidden; }
      }

      /* 點選「程式碼重構」快速標籤的狀態切換 */
      @keyframes tagRefactorAnim {
        0%, 25% { fill: #282828; stroke: #504945; }
        28%, 100% { fill: #fabd2f; stroke: #fabd2f; }
      }
      @keyframes tagRefactorText {
        0%, 25% { fill: #ebdbb2; }
        28%, 100% { fill: #1d2021; font-weight: bold; }
      }

      /* 自動填入指令文字 */
      @keyframes promptInputText {
        0%, 25% { opacity: 0; }
        28%, 100% { opacity: 1; }
      }

      /* 原本代碼 (替換前) */
      @keyframes codeBeforeAnim {
        0%, 45% { opacity: 1; }
        48%, 100% { opacity: 0; }
      }

      /* 原地重構後代碼 (替換後修改生效) */
      @keyframes codeAfterAnim {
        0%, 45% { opacity: 0; }
        48%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      /* 重構成功通知徽章 */
      @keyframes inPlaceBadgeAnim {
        0%, 46% { opacity: 0; visibility: hidden; }
        49%, 92% { opacity: 1; visibility: visible; }
        96%, 100% { opacity: 0; visibility: hidden; }
      }

      /* 游標軌跡 (精確鎖定按鈕坐標 X: 520, Y: 251 與 X: 671, Y: 290) */
      @keyframes cursorInlineMovement {
        0% { transform: translate(550px, 320px); opacity: 0; }
        4% { transform: translate(550px, 320px); opacity: 1; }
        /* 1. 游標移至「程式碼重構」標籤正中心 (X: 517, Y: 251) */
        22%, 24% { transform: translate(517px, 251px) scale(1); }
        26%, 28% { transform: translate(517px, 251px) scale(0.86); }
        30% { transform: translate(517px, 251px) scale(1); }
        /* 2. 游標移至「↵ 原地置換」按鈕正中心 (X: 669, Y: 290) */
        38%, 40% { transform: translate(669px, 290px) scale(1); }
        /* 3. 在 4.2s ~ 4.4s 確實按下點擊！ */
        42%, 44% { transform: translate(669px, 290px) scale(0.86); }
        46% { transform: translate(669px, 290px) scale(1); }
        54%, 100% { transform: translate(720px, 320px); opacity: 0; }
      }

      .prompt-card { animation: promptCardAnim 8.5s ease-in-out infinite; }
      .tag-rf-box { animation: tagRefactorAnim 8.5s ease-in-out infinite; }
      .tag-rf-txt { animation: tagRefactorText 8.5s ease-in-out infinite; }
      .input-fill-txt { animation: promptInputText 8.5s ease-in-out infinite; }
      .code-before { animation: codeBeforeAnim 8.5s ease-in-out infinite; }
      .code-after { animation: codeAfterAnim 8.5s ease-in-out infinite; }
      .badge-success { animation: inPlaceBadgeAnim 8.5s ease-in-out infinite; }
      .mouse-inline { animation: cursorInlineMovement 8.5s cubic-bezier(0.25, 1, 0.5, 1) infinite; pointer-events: none; }
    </style>
  </defs>

  <!-- 主視窗容器外框 (固定) -->
  <g filter="url(#winShadow)">
    <rect x="10" y="10" width="860" height="460" rx="12" fill="url(#bgGrad)" stroke="#3c3836" stroke-width="1.5" />
  </g>

  <!-- 頂部視窗標題列 (固定) -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 858 10 C 864.63 10 870 15.37 870 22 L 870 44 L 10 44 Z" fill="#282828" />
  <line x1="10" y1="44" x2="870" y2="44" stroke="#3c3836" stroke-width="1" />

  <!-- 視窗三色燈 -->
  <circle cx="32" cy="27" r="5.5" fill="#cc241d" />
  <circle cx="48" cy="27" r="5.5" fill="#d79921" />
  <circle cx="64" cy="27" r="5.5" fill="#98971a" />

  <!-- 標題與分頁 (全面升級 Bamboo Icon) -->
  <g transform="translate(86, 17)">
    <rect x="0" y="0" width="340" height="22" rx="4" fill="#1d2021" stroke="#3c3836" stroke-width="1" />
    <use href="#bamboo-icon" x="6" y="2" width="18" height="18" />
    <text x="30" y="15" fill="#fabd2f" font-size="11" font-weight="bold">竹語・廣零散 ── 隨行行內 AI (Inline AI Copilot)</text>
    <circle cx="324" cy="11" r="3" fill="#b8bb26" />
  </g>

  <!-- 右側快捷鍵提示徽章 -->
  <g transform="translate(710, 16)">
    <rect x="0" y="0" width="144" height="24" rx="4" fill="#fe8019" />
    <use href="#bamboo-mark" x="8" y="3" width="18" height="18" />
    <text x="30" y="16" fill="#1d2021" font-size="11" font-weight="bold">Ctrl + K 喚醒提詞</text>
  </g>

  <!-- ==================== 編輯器主畫面 (坐標固定在 X:30, Y:56) ==================== -->
  <g transform="translate(30, 56)">
    <rect x="0" y="0" width="820" height="394" rx="8" fill="#1d2021" stroke="#3c3836" stroke-width="1.2" />

    <!-- 編輯器程式碼行內容 -->
    <g transform="translate(24, 28)">
      
      <!-- 行號 10 ~ 12 (使用 tspan 自動計算字距，絕不重疊) -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#504945" font-size="12">10</text>
        <text x="32" y="0" font-size="12.5">
          <tspan fill="#8ec07c" font-weight="bold">import</tspan>
          <tspan fill="#ebdbb2"> { fetchVaultItem } </tspan>
          <tspan fill="#8ec07c" font-weight="bold">from</tspan>
          <tspan fill="#b8bb26"> './vault'</tspan>
          <tspan fill="#ebdbb2">;</tspan>
        </text>
      </g>

      <g transform="translate(0, 24)">
        <text x="0" y="0" fill="#504945" font-size="12">11</text>
        <text x="32" y="0" fill="#a89984" font-size="12">// 待優化：這段目前是無型別的陽春 JavaScript 寫法</text>
      </g>

      <g transform="translate(0, 48)">
        <text x="0" y="0" fill="#504945" font-size="12">12</text>
      </g>

      <!-- ==================== 階段 1：選取區塊高光遮罩 (高度 96px，包覆第 13~16 行結尾括號，絕不切到註解) ==================== -->
      <g transform="translate(24, 56)">
        <rect x="0" y="0" width="740" height="96" rx="6" fill="#b8bb26" fill-opacity="0.12" stroke="#b8bb26" stroke-width="1.2" stroke-dasharray="5,4" />
        <text x="626" y="20" fill="#b8bb26" font-size="10.5" font-weight="bold">[已選取片段 (4 行)]</text>
      </g>

      <!-- ==================== A. 替換前的原始代碼 (第 13~16 行) ==================== -->
      <g class="code-before" transform="translate(0, 72)">
        <g transform="translate(0, 0)">
          <text x="0" y="0" fill="#fb4934" font-size="12">13</text>
          <text x="32" y="0" fill="#ebdbb2" font-size="12.5">function processRecord(rawId) {</text>
        </g>
        <g transform="translate(0, 24)">
          <text x="0" y="0" fill="#fb4934" font-size="12">14</text>
          <text x="56" y="0" fill="#ebdbb2" font-size="12.5">let res = fetchVaultItem(rawId);</text>
        </g>
        <g transform="translate(0, 48)">
          <text x="0" y="0" fill="#fb4934" font-size="12">15</text>
          <text x="56" y="0" fill="#ebdbb2" font-size="12.5">return res;</text>
        </g>
        <g transform="translate(0, 72)">
          <text x="0" y="0" fill="#fb4934" font-size="12">16</text>
          <text x="32" y="0" fill="#ebdbb2" font-size="12.5">}</text>
        </g>
      </g>

      <!-- ==================== B. ★ 替換後的原地重構代碼 (流式 tspan 排版，絕不撞字重疊) ==================== -->
      <g class="code-after" transform="translate(0, 72)">
        <g transform="translate(0, 0)">
          <text x="0" y="0" fill="#b8bb26" font-size="12">13</text>
          <text x="32" y="0" font-size="12.5">
            <tspan fill="#8ec07c" font-weight="bold">export async function </tspan>
            <tspan fill="#fabd2f" font-weight="bold">processRecord</tspan>
            <tspan fill="#ebdbb2">(rawId: </tspan>
            <tspan fill="#fe8019">string</tspan>
            <tspan fill="#ebdbb2">): </tspan>
            <tspan fill="#8ec07c">Promise&lt;VaultItem&gt;</tspan>
            <tspan fill="#ebdbb2"> {</tspan>
          </text>
        </g>
        <g transform="translate(0, 24)">
          <text x="0" y="0" fill="#b8bb26" font-size="12">14</text>
          <text x="56" y="0" font-size="12.5">
            <tspan fill="#8ec07c" font-weight="bold">try</tspan>
            <tspan fill="#ebdbb2"> { </tspan>
            <tspan fill="#8ec07c" font-weight="bold">const</tspan>
            <tspan fill="#ebdbb2"> res = </tspan>
            <tspan fill="#8ec07c" font-weight="bold">await</tspan>
            <tspan fill="#ebdbb2"> fetchVaultItem(rawId); </tspan>
            <tspan fill="#8ec07c" font-weight="bold">return</tspan>
            <tspan fill="#ebdbb2"> res.data; }</tspan>
          </text>
        </g>
        <g transform="translate(0, 48)">
          <text x="0" y="0" fill="#b8bb26" font-size="12">15</text>
          <text x="56" y="0" font-size="12.5">
            <tspan fill="#8ec07c" font-weight="bold">catch</tspan>
            <tspan fill="#ebdbb2"> (err) { </tspan>
            <tspan fill="#fe8019">console</tspan>
            <tspan fill="#ebdbb2">.error(</tspan>
            <tspan fill="#b8bb26">'[Vault] load error'</tspan>
            <tspan fill="#ebdbb2">, err); </tspan>
            <tspan fill="#8ec07c" font-weight="bold">throw</tspan>
            <tspan fill="#ebdbb2"> err; }</tspan>
          </text>
        </g>
        <g transform="translate(0, 72)">
          <text x="0" y="0" fill="#b8bb26" font-size="12">16</text>
          <text x="32" y="0" fill="#ebdbb2" font-size="12.5">}</text>
        </g>
      </g>

      <!-- 行號 17 之後 (下移至 y=178，徹底遠離框線，不再切到) -->
      <g transform="translate(0, 178)">
        <text x="0" y="0" fill="#504945" font-size="12">17</text>
        <text x="32" y="0" fill="#a89984" font-size="12.5">// 後續呼叫端邏輯保持不變...</text>
      </g>
    </g>

    <!-- ==================== 階段 2：浮動提詞器卡片 (AiInlinePrompt) ==================== -->
    <g class="prompt-card" transform="translate(130, 150)">
      <rect x="0" y="0" width="580" height="116" rx="8" fill="url(#promptCardBg)" stroke="#fabd2f" stroke-width="1.6" filter="url(#winShadow)" />

      <!-- 卡片標頭列 -->
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 572 0 C 576.42 0 580 3.58 580 8 L 580 26 L 0 26 Z" fill="#32302f" />
      <use href="#bamboo-icon" x="8" y="4" width="18" height="18" />
      <text x="30" y="18" fill="#fabd2f" font-size="11" font-weight="bold">Inline AI 隨行提詞 ── 精準針對選取區塊</text>
      <text x="490" y="18" fill="#a89984" font-size="10">Esc 取消</text>

      <!-- 快速標籤列 (4 個膠囊，使用獨立 g 容器徹底防重疊) -->
      <g transform="translate(14, 34)">
        <!-- 標籤 1: 優雅結構化 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="88" height="22" rx="11" fill="#282828" stroke="#504945" />
          <text x="44" y="15" text-anchor="middle" fill="#ebdbb2" font-size="10">優雅結構化</text>
        </g>

        <!-- 標籤 2: 提取待辦 -->
        <g transform="translate(96, 0)">
          <rect x="0" y="0" width="78" height="22" rx="11" fill="#282828" stroke="#504945" />
          <text x="39" y="15" text-anchor="middle" fill="#ebdbb2" font-size="10">提取待辦</text>
        </g>

        <!-- 標籤 3: 台灣繁體 -->
        <g transform="translate(182, 0)">
          <rect x="0" y="0" width="100" height="22" rx="11" fill="#282828" stroke="#504945" />
          <text x="50" y="15" text-anchor="middle" fill="#ebdbb2" font-size="10">台灣繁體潤飾</text>
        </g>

        <!-- ★ 標籤 4: 程式碼重構 (點擊目標！坐標中心 X: 517, Y: 251) -->
        <g transform="translate(290, 0)">
          <rect class="tag-rf-box" x="0" y="0" width="108" height="22" rx="11" fill="#282828" stroke="#504945" />
          <text class="tag-rf-txt" x="54" y="15" text-anchor="middle" fill="#ebdbb2" font-size="10">⚡ 程式碼重構</text>
        </g>
      </g>

      <!-- 行內提詞輸入列 -->
      <g transform="translate(14, 66)">
        <rect x="0" y="0" width="552" height="36" rx="4" fill="#1d2021" stroke="#fe8019" stroke-width="1.2" />
        
        <!-- 自動填入的提示詞 (垂直精準置中) -->
        <g class="input-fill-txt" transform="translate(12, 10)">
          <use href="#bamboo-mark" x="0" y="0" width="16" height="16" />
          <text x="22" y="12" fill="#fabd2f" font-size="10.5" font-weight="500">補齊 TypeScript 強型別、async/await 與例外捕捉保護</text>
        </g>

        <!-- ★ 右側「↵ 原地置換」按鈕 (點擊坐標 X: 669, Y: 290) -->
        <g transform="translate(444, 5)">
          <rect x="0" y="0" width="100" height="26" rx="3" fill="#b8bb26" />
          <text x="50" y="17" text-anchor="middle" fill="#1d2021" font-size="10.5" font-weight="bold">↵ 原地置換</text>
        </g>
      </g>
    </g>

    <!-- ==================== 階段 4：原地重構成功徽章 ==================== -->
    <g class="badge-success" transform="translate(24, 256)">
      <rect x="0" y="0" width="772" height="42" rx="6" fill="#282828" stroke="#b8bb26" stroke-width="1.2" />
      <use href="#bamboo-icon" x="12" y="11" width="20" height="20" />
      <text x="38" y="24" fill="#b8bb26" font-size="12" font-weight="bold">✨ 已完成原地修改替換 (In-Place Rewrite)！</text>
      <text x="320" y="24" fill="#ebdbb2" font-size="11.5">代碼已升級為強型別，手感與游標完全維持原地，零中斷心流。</text>
    </g>

    <!-- 底部狀態列 -->
    <g transform="translate(0, 364)">
      <rect x="0" y="0" width="820" height="30" rx="0" fill="#282828" />
      <line x1="0" y1="0" x2="820" y2="0" stroke="#3c3836" stroke-width="1" />
      <text x="16" y="19" fill="#a89984" font-size="11">TypeScript  |  Ln 14, Col 2  |  ⚡ Inline Copilot Ready</text>
      <text x="640" y="19" fill="#b8bb26" font-size="11">選取文字按 Ctrl+K 隨按隨至</text>
    </g>
  </g>

  <!-- ==================== 模擬游標 (精確鎖定標籤與確認按鈕點擊) ==================== -->
  <g class="mouse-inline">
    <path d="M 0 0 L 0 16 L 4.5 12.5 L 8 19 L 10.5 17.5 L 7 11.5 L 12.5 11.5 Z" fill="#fbf1c7" stroke="#1d2021" stroke-width="1.2" />
  </g>
</svg>
