<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" style="background: transparent; font-family: ui-monospace, 'Cascadia Code', 'Fira Code', 'Noto Sans TC', system-ui, sans-serif;">
  <defs>
    <!-- 背景漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2021" />
      <stop offset="50%" stop-color="#282828" />
      <stop offset="100%" stop-color="#1d2021" />
    </linearGradient>

    <!-- 彈窗漸層 -->
    <linearGradient id="modalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282828" />
      <stop offset="100%" stop-color="#1d2021" />
    </linearGradient>

    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- ==================== 專案正統 Bamboo 圖標庫 ==================== -->
    <symbol id="bamboo-icon" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#282828"/>
      <path d="M26 12 L26 52 M38 12 L38 52" stroke="#b8bb26" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M22 24 C28 22 34 22 42 24 M22 40 C28 38 34 38 42 40" stroke="#fabd2f" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="26" cy="24" r="3.2" fill="#fe8019"/>
      <circle cx="38" cy="40" r="3.2" fill="#fe8019"/>
      <path d="M38 20 Q48 16 46 28 Q40 26 38 20 Z" fill="#b8bb26" opacity="0.9"/>
      <path d="M26 36 Q16 32 18 44 Q24 42 26 36 Z" fill="#b8bb26" opacity="0.9"/>
    </symbol>

    <symbol id="bamboo-mark" viewBox="0 0 64 64">
      <path d="M26 12 L26 52 M38 12 L38 52" stroke="#b8bb26" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M22 24 C28 22 34 22 42 24 M22 40 C28 38 34 38 42 40" stroke="#fabd2f" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="26" cy="24" r="3.2" fill="#fe8019"/>
      <circle cx="38" cy="40" r="3.2" fill="#fe8019"/>
      <path d="M38 20 Q48 16 46 28 Q40 26 38 20 Z" fill="#b8bb26" opacity="0.9"/>
      <path d="M26 36 Q16 32 18 44 Q24 42 26 36 Z" fill="#b8bb26" opacity="0.9"/>
    </symbol>

    <style>
      /* ==================== 8.5 秒極速俐落時序 (純 Opacity，絕不跑位) ==================== */
      /*
         0s ~ 1.2s : 階段 1 - 隨手速記，游標移至右上「💾 智能存檔」按鈕
         1.2s ~ 2.4s: 階段 2A - 彈出視窗，初始顯示「未命名草稿」，AI 極速辨識 (0.8s)
         2.4s ~ 5.6s: 階段 2B - 【辨識修改完成】瞬間替換為智能檔名與架構目錄，游標移向按鈕
         5.6s ~ 6.2s: 階段 3 - 游標在按鈕 (X:570, Y:367) 上【點擊按下儲存】！
         6.2s ~ 7.8s: 階段 4 - 成功歸檔入櫃通知
         7.8s ~ 8.5s: 循環淡出
      */

      /* 彈窗顯示 */
      @keyframes modalAnim {
        0%, 12% { opacity: 0; visibility: hidden; }
        15%, 68% { opacity: 1; visibility: visible; }
        72%, 100% { opacity: 0; visibility: hidden; }
      }

      /* 極速掃描線光束 (僅在 1.4s ~ 2.4s 快速掃描) */
      @keyframes scanAnim {
        0% { transform: translateX(0); opacity: 0.9; }
        100% { transform: translateX(380px); opacity: 0.1; }
      }

      /* 狀態 A：AI 辨識前的原始預設狀態 (未命名草稿) */
      @keyframes beforeAiState {
        0%, 13% { opacity: 0; }
        15%, 26% { opacity: 1; }
        29%, 100% { opacity: 0; }
      }

      /* 狀態 B：AI 辨識後的修改結果 (瞬間替換為語義檔名與對應目錄) */
      @keyframes afterAiState {
        0%, 27% { opacity: 0; }
        30%, 70% { opacity: 1; }
        74%, 100% { opacity: 0; }
      }

      /* 儲存成功徽章 (6.2s ~ 7.8s) */
      @keyframes successBadgeAnim {
        0%, 70% { opacity: 0; visibility: hidden; }
        73%, 92% { opacity: 1; visibility: visible; }
        96%, 100% { opacity: 0; visibility: hidden; }
      }

      /* 鼠標移動軌跡 (精確鎖定按鈕坐標 X: 570, Y: 367) */
      @keyframes cursorSaveMovement {
        0% { transform: translate(650px, 200px); opacity: 0; }
        4% { transform: translate(650px, 200px); opacity: 1; }
        /* 1. 移動到頂部儲存按鈕 (x: 782, y: 28) 並點擊 */
        10%, 12% { transform: translate(782px, 28px) scale(0.88); }
        14% { transform: translate(782px, 28px) scale(1); }
        /* 等待 AI 辨識修改 (1.6s ~ 2.6s 游標移入彈窗) */
        22%, 35% { transform: translate(620px, 220px); opacity: 1; }
        /* 2. 移動到「一鍵歸櫃」按鈕正中心 (X: 570, Y: 367) */
        46%, 54% { transform: translate(570px, 367px) scale(1); }
        /* 3. 在 5.6s ~ 6.0s 確實點擊按下！ */
        57%, 59% { transform: translate(570px, 367px) scale(0.86); }
        62% { transform: translate(570px, 367px) scale(1); }
        70%, 100% { transform: translate(620px, 400px); opacity: 0; }
      }

      .modal-box { animation: modalAnim 8.5s ease-in-out infinite; }
      .scan-line { animation: scanAnim 0.8s linear infinite; }
      .state-before { animation: beforeAiState 8.5s ease-in-out infinite; }
      .state-after { animation: afterAiState 8.5s ease-in-out infinite; }
      .success-box { animation: successBadgeAnim 8.5s ease-in-out infinite; }
      .mouse-save { animation: cursorSaveMovement 8.5s cubic-bezier(0.25, 1, 0.5, 1) infinite; pointer-events: none; }
    </style>
  </defs>

  <!-- 主視窗容器外框 (固定) -->
  <g filter="url(#winShadow)">
    <rect x="10" y="10" width="860" height="460" rx="12" fill="url(#bgGrad)" stroke="#3c3836" stroke-width="1.5" />
  </g>

  <!-- 頂部視窗標題列 (固定) -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 858 10 C 864.63 10 870 15.37 870 22 L 870 44 L 10 44 Z" fill="#282828" />
  <line x1="10" y1="44" x2="870" y2="44" stroke="#3c3836" stroke-width="1" />

  <!-- 視窗三色燈 -->
  <circle cx="32" cy="27" r="5.5" fill="#cc241d" />
  <circle cx="48" cy="27" r="5.5" fill="#d79921" />
  <circle cx="64" cy="27" r="5.5" fill="#98971a" />

  <!-- 標題與分頁 (全面升級 Bamboo Icon) -->
  <g transform="translate(86, 17)">
    <rect x="0" y="0" width="330" height="22" rx="4" fill="#1d2021" stroke="#3c3836" stroke-width="1" />
    <use href="#bamboo-icon" x="6" y="2" width="18" height="18" />
    <text x="30" y="15" fill="#fabd2f" font-size="11" font-weight="bold">竹語・廣零散 ── AI 自動判斷位置儲存 (Smart Save)</text>
    <circle cx="314" cy="11" r="3" fill="#b8bb26" />
  </g>

  <!-- 右側快速儲存按鈕 (觸發點) -->
  <g transform="translate(710, 16)">
    <rect x="0" y="0" width="144" height="24" rx="4" fill="#fe8019" />
    <use href="#bamboo-mark" x="8" y="3" width="18" height="18" />
    <text x="30" y="16" fill="#1d2021" font-size="11" font-weight="bold">智能存檔 (Ctrl+S)</text>
  </g>

  <!-- ==================== 工作區外層容器 (坐標固定在 x:30, y:56) ==================== -->
  <g transform="translate(30, 56)">
    <rect x="0" y="0" width="820" height="394" rx="8" fill="#1d2021" stroke="#3c3836" stroke-width="1.2" />
    
    <!-- 筆記內容 -->
    <g transform="translate(24, 28)">
      <text x="0" y="0" fill="#a89984" font-size="12.5">// 開發者隨手貼入的 Rust Tauri 與檔案監聽架構速記</text>
      
      <g transform="translate(0, 28)">
        <text x="0" y="0" fill="#8ec07c" font-size="13" font-weight="bold">use</text>
        <text x="32" y="0" fill="#ebdbb2" font-size="13"> notify::{Watcher, RecursiveMode};</text>
      </g>
      <g transform="translate(0, 52)">
        <text x="0" y="0" fill="#8ec07c" font-size="13" font-weight="bold">pub struct</text>
        <text x="82" y="0" fill="#fabd2f" font-size="13" font-weight="bold"> FileWatcherManager</text>
        <text x="240" y="0" fill="#ebdbb2" font-size="13"> {</text>
      </g>
      <g transform="translate(20, 76)">
        <text x="0" y="0" fill="#ebdbb2" font-size="13">watched_files: HashSet&lt;PathBuf&gt;,</text>
      </g>
      <g transform="translate(20, 100)">
        <text x="0" y="0" fill="#ebdbb2" font-size="13">last_written_hashes: HashMap&lt;String, u64&gt;,</text>
      </g>
      <g transform="translate(0, 124)">
        <text x="0" y="0" fill="#ebdbb2" font-size="13">}</text>
      </g>

      <g transform="translate(0, 160)">
        <rect x="0" y="-12" width="52" height="18" rx="3" fill="#fe8019" fill-opacity="0.2" />
        <text x="6" y="1" fill="#fe8019" font-size="10.5" font-weight="bold">MEMO</text>
        <text x="60" y="1" fill="#ebdbb2" font-size="12.5">此段屬於 Tauri 核心後端監聽模組，專責毫秒級本地儲存防重開機機制。</text>
      </g>
    </g>

    <!-- 狀態列 (自動座標與字數) -->
    <g transform="translate(0, 364)">
      <rect x="0" y="0" width="820" height="30" rx="0" fill="#282828" />
      <line x1="0" y1="0" x2="820" y2="0" stroke="#3c3836" stroke-width="1" />
      <text x="16" y="19" fill="#a89984" font-size="11">UTF-8  |  Rust / Markdown  |  Ln 14, Col 2  |  ⚡ 毫秒持久化中</text>
      <text x="660" y="19" fill="#b8bb26" font-size="11">零檔案負擔・點開即寫</text>
    </g>
  </g>

  <!-- ==================== ★★★ 核心展示：AI 智能存檔彈窗 (寬 540，置中 X:170, Y:55) ★★★ ==================== -->
  <g transform="translate(170, 55)">
    <g class="modal-box">
      <!-- 視窗主卡片 -->
      <rect x="0" y="0" width="540" height="350" rx="10" fill="url(#modalBg)" stroke="#fabd2f" stroke-width="1.8" filter="url(#winShadow)" />
      
      <!-- 彈窗標題列 (高度 38) -->
      <path d="M 0 10 C 0 4.47 4.47 0 10 0 L 530 0 C 535.53 0 540 4.47 540 10 L 540 38 L 0 38 Z" fill="#32302f" />
      <line x1="0" y1="38" x2="540" y2="38" stroke="#3c3836" stroke-width="1" />
      <use href="#bamboo-mark" x="14" y="9" width="20" height="20" />
      <text x="38" y="24" fill="#fabd2f" font-size="12" font-weight="bold">AI 智能分析：自動判斷位置與檔名</text>
      
      <!-- 極速掃描進度指示條 (高度 22) -->
      <g transform="translate(18, 48)">
        <rect x="0" y="0" width="504" height="22" rx="4" fill="#1d2021" stroke="#3c3836" />
        <circle cx="12" cy="11" r="3.5" fill="#b8bb26" />
        <text x="24" y="15" fill="#ebdbb2" font-size="10">⚡ 極速辨識中 (0.8s)... 深度匹配專案目錄骨架</text>
        <line class="scan-line" x1="100" y1="21" x2="160" y2="21" stroke="#fabd2f" stroke-width="2" />
      </g>

      <!-- ==================== A. 辨識前狀態 (未命名草稿，初始呈現) ==================== -->
      <g class="state-before">
        <!-- 原始預設檔名 -->
        <g transform="translate(18, 80)">
          <text x="0" y="10" fill="#a89984" font-size="10">目前檔名：</text>
          <rect x="0" y="16" width="504" height="32" rx="4" fill="#1d2021" stroke="#504945" stroke-dasharray="4,3" />
          <text x="12" y="36" fill="#a89984" font-size="10">Untitled-scratchpad.txt</text>
          <rect x="424" y="21" width="68" height="21" rx="3" fill="#3c3836" />
          <text x="432" y="35" fill="#ebdbb2" font-size="9">未命名草稿</text>
        </g>

        <!-- 原始預設目錄 -->
        <g transform="translate(18, 142)">
          <text x="0" y="10" fill="#a89984" font-size="10">儲存目標目錄：</text>
          <rect x="0" y="16" width="504" height="36" rx="4" fill="#1d2021" stroke="#504945" stroke-dasharray="4,3" />
          <g transform="translate(12, 25)">
            <text x="4" y="12" fill="#a89984" font-size="11">~/Vault/ (預設未分類)</text>
          </g>
        </g>

        <!-- 辨識中提示 -->
        <g transform="translate(18, 206)">
          <rect x="0" y="0" width="504" height="38" rx="4" fill="#282828" stroke="#3c3836" />
          <text x="12" y="24" fill="#fabd2f" font-size="10.5">🔍 正在讀取 Rust 語義特徵，即將推導最佳命名與存放目錄...</text>
        </g>
      </g>

      <!-- ==================== B. ★ 辨識修改完成狀態 (瞬間替換為精準結果) ==================== -->
      <g class="state-after">
        <!-- 1. 檔名被修改為推薦語義檔名 -->
        <g transform="translate(18, 80)">
          <text x="0" y="10" fill="#fe8019" font-size="10" font-weight="bold">✨ 語義化推薦檔名 (已自動推導替換)：</text>
          
          <rect x="0" y="16" width="504" height="32" rx="4" fill="#1d2021" stroke="#fe8019" stroke-width="1.4" />
          
          <!-- 精巧小字檔名 (9.5px) -->
          <text x="12" y="36" fill="#fabd2f" font-size="9.5" font-weight="600" letter-spacing="0.3">2026-10-22_tauri_file_watcher_架構.rs</text>
          
          <rect x="444" y="21" width="48" height="21" rx="3" fill="#fe8019" fill-opacity="0.25" stroke="#fe8019" stroke-width="0.8" />
          <text x="450" y="35" fill="#fe8019" font-size="9" font-weight="bold">AI 命名</text>
        </g>

        <!-- 2. 目錄被修改重定向為架構目錄 -->
        <g transform="translate(18, 142)">
          <text x="0" y="10" fill="#b8bb26" font-size="10" font-weight="bold">📁 自動推導本機儲存位置 (已自動匹配專案路徑)：</text>
          
          <rect x="0" y="16" width="504" height="36" rx="4" fill="#1d2021" stroke="#b8bb26" stroke-width="1.4" />
          
          <g transform="translate(12, 25)">
            <use href="#bamboo-mark" x="0" y="-3" width="16" height="16" />
            <text x="22" y="12" fill="#b8bb26" font-size="11.5" font-weight="bold">src-tauri / src / watcher /</text>
            <text x="195" y="12" fill="#a89984" font-size="10"> （已命中 watcher 模組）</text>
          </g>
        </g>

        <!-- 3. AI 判斷依據 -->
        <g transform="translate(18, 206)">
          <rect x="0" y="0" width="504" height="38" rx="4" fill="#282828" stroke="#3c3836" />
          <text x="12" y="15" fill="#8ec07c" font-size="10" font-weight="bold">💡 智慧判斷依據：</text>
          <text x="12" y="29" fill="#ebdbb2" font-size="9.5">內容包含 Rust notify 檔案監聽與 HashMap 快取，精準對應後端核心目錄。</text>
        </g>
      </g>

      <!-- 彈窗底部操作按鈕 -->
      <g transform="translate(18, 296)">
        <rect x="0" y="0" width="88" height="32" rx="4" fill="#3c3836" />
        <text x="20" y="20" fill="#ebdbb2" font-size="11">略過/手動</text>

        <!-- ★ 主要存檔確認按鈕：全局中心 X: 570, Y: 367 ★ -->
        <g transform="translate(260, 0)">
          <rect x="0" y="0" width="244" height="32" rx="4" fill="#b8bb26" />
          <use href="#bamboo-icon" x="12" y="6" width="20" height="20" />
          <text x="36" y="20" fill="#1d2021" font-size="11.5" font-weight="bold">↵ 一鍵歸櫃 (自動存檔至此)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== 階段 3：成功反饋提示 (外層坐標固定在 x:260, y:170) ==================== -->
  <g transform="translate(260, 170)">
    <g class="success-box">
      <rect x="0" y="0" width="360" height="140" rx="8" fill="#1d2021" stroke="#b8bb26" stroke-width="2" filter="url(#winShadow)" />
      <use href="#bamboo-icon" x="160" y="22" width="40" height="40" />
      <text x="180" y="85" text-anchor="middle" fill="#fbf1c7" font-size="15" font-weight="bold">🎉 已成功歸檔入櫃！</text>
      <text x="180" y="110" text-anchor="middle" fill="#8ec07c" font-size="11.5">已自動就地儲存至：src-tauri/src/watcher/</text>
    </g>
  </g>

  <!-- ==================== 模擬游標 (精確鎖定按鈕點擊) ==================== -->
  <g class="mouse-save">
    <path d="M 0 0 L 0 16 L 4.5 12.5 L 8 19 L 10.5 17.5 L 7 11.5 L 12.5 11.5 Z" fill="#fbf1c7" stroke="#1d2021" stroke-width="1.2" />
  </g>
</svg>
