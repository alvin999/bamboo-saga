<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" style="background: transparent; font-family: ui-monospace, 'Cascadia Code', 'Fira Code', 'Noto Sans TC', system-ui, sans-serif;">
  <defs>
    <!-- 背景漸層 (Gruvbox 深度暗底) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2021" />
      <stop offset="50%" stop-color="#282828" />
      <stop offset="100%" stop-color="#1d2021" />
    </linearGradient>

    <!-- 雙欄比對面板漸層 -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282828" />
      <stop offset="100%" stop-color="#1d2021" />
    </linearGradient>

    <!-- 視窗懸浮陰影 -->
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- ==================== 專案正統 Bamboo 圖標庫 ==================== -->
    <symbol id="bamboo-icon" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#282828"/>
      <path d="M26 12 L26 52 M38 12 L38 52" stroke="#b8bb26" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M22 24 C28 22 34 22 42 24 M22 40 C28 38 34 38 42 40" stroke="#fabd2f" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="26" cy="24" r="3.2" fill="#fe8019"/>
      <circle cx="38" cy="40" r="3.2" fill="#fe8019"/>
      <path d="M38 20 Q48 16 46 28 Q40 26 38 20 Z" fill="#b8bb26" opacity="0.9"/>
      <path d="M26 36 Q16 32 18 44 Q24 42 26 36 Z" fill="#b8bb26" opacity="0.9"/>
    </symbol>

    <symbol id="bamboo-mark" viewBox="0 0 64 64">
      <path d="M26 12 L26 52 M38 12 L38 52" stroke="#b8bb26" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M22 24 C28 22 34 22 42 24 M22 40 C28 38 34 38 42 40" stroke="#fabd2f" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="26" cy="24" r="3.2" fill="#fe8019"/>
      <circle cx="38" cy="40" r="3.2" fill="#fe8019"/>
      <path d="M38 20 Q48 16 46 28 Q40 26 38 20 Z" fill="#b8bb26" opacity="0.9"/>
      <path d="M26 36 Q16 32 18 44 Q24 42 26 36 Z" fill="#b8bb26" opacity="0.9"/>
    </symbol>

    <style>
      /* ==================== 8.5 秒極速時序 (純 Opacity，絕不跑位) ==================== */
      /*
         0s ~ 1.2s : 階段 1 - 編輯器狀態列點擊「📜 本地時光機 (Local History)」
         1.2s ~ 2.4s: 階段 2 - 展開雙欄 Diff 時光機面板，游標移向「Pre-AI 煉丹前快照」
         2.4s ~ 3.2s: 階段 3 - 游標點擊快照卡片，雙欄 Diff 即時聯動對比 (紅刪綠增)
         3.2s ~ 5.6s: 階段 4 - 游標移至右下角「⏪ 一鍵無損還原至此版本」按鈕正中心 (X: 710, Y: 412)
         5.6s ~ 6.2s: 階段 5 - ★ 確實按下點擊 (scale 0.86)！
         6.2s ~ 7.8s: 階段 6 - 跳出成功還原提示
         7.8s ~ 8.5s: 循環淡出
      */

      /* 歷史視窗整體顯示 */
      @keyframes historyModalAnim {
        0%, 12% { opacity: 0; visibility: hidden; }
        15%, 68% { opacity: 1; visibility: visible; }
        72%, 100% { opacity: 0; visibility: hidden; }
      }

      /* 點擊切換快照的 Diff 變化 */
      @keyframes diffRevealAnim {
        0%, 25% { opacity: 0.6; }
        28%, 100% { opacity: 1; }
      }

      /* 還原成功提示徽章 */
      @keyframes revertSuccessAnim {
        0%, 70% { opacity: 0; visibility: hidden; }
        73%, 92% { opacity: 1; visibility: visible; }
        96%, 100% { opacity: 0; visibility: hidden; }
      }

      /* 游標軌跡 (鎖定按鈕精確坐標) */
      @keyframes cursorHistoryMovement {
        0% { transform: translate(500px, 350px); opacity: 0; }
        4% { transform: translate(500px, 350px); opacity: 1; }
        /* 1. 移動到頂部歷史按鈕 (X: 750, Y: 28) 並點擊 */
        10%, 12% { transform: translate(750px, 28px) scale(0.88); }
        14% { transform: translate(750px, 28px) scale(1); }
        /* 2. 移向左側時間軸的「Pre-AI 煉丹前快照」(X: 130, Y: 138) */
        22%, 25% { transform: translate(130px, 138px) scale(1); }
        27%, 29% { transform: translate(130px, 138px) scale(0.88); }
        31% { transform: translate(130px, 138px) scale(1); }
        /* 3. 移向右下角「一鍵無損還原」按鈕 (X: 710, Y: 412) */
        44%, 54% { transform: translate(710px, 412px) scale(1); }
        /* 4. 在 5.6s ~ 6.0s 確實點擊按下！ */
        57%, 59% { transform: translate(710px, 412px) scale(0.86); }
        62% { transform: translate(710px, 412px) scale(1); }
        68%, 100% { transform: translate(750px, 440px); opacity: 0; }
      }

      .modal-history { animation: historyModalAnim 8.5s ease-in-out infinite; }
      .diff-reveal { animation: diffRevealAnim 8.5s ease-in-out infinite; }
      .revert-success { animation: revertSuccessAnim 8.5s ease-in-out infinite; }
      .mouse-history { animation: cursorHistoryMovement 8.5s cubic-bezier(0.25, 1, 0.5, 1) infinite; pointer-events: none; }
    </style>
  </defs>

  <!-- 主視窗容器外框 (固定) -->
  <g filter="url(#winShadow)">
    <rect x="10" y="10" width="860" height="460" rx="12" fill="url(#bgGrad)" stroke="#3c3836" stroke-width="1.5" />
  </g>

  <!-- 頂部視窗標題列 (固定) -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 858 10 C 864.63 10 870 15.37 870 22 L 870 44 L 10 44 Z" fill="#282828" />
  <line x1="10" y1="44" x2="870" y2="44" stroke="#3c3836" stroke-width="1" />

  <!-- 視窗三色燈 -->
  <circle cx="32" cy="27" r="5.5" fill="#cc241d" />
  <circle cx="48" cy="27" r="5.5" fill="#d79921" />
  <circle cx="64" cy="27" r="5.5" fill="#98971a" />

  <!-- 標題與分頁 (全面升級 Bamboo Icon) -->
  <g transform="translate(86, 17)">
    <rect x="0" y="0" width="340" height="22" rx="4" fill="#1d2021" stroke="#3c3836" stroke-width="1" />
    <use href="#bamboo-icon" x="6" y="2" width="18" height="18" />
    <text x="30" y="15" fill="#fabd2f" font-size="11" font-weight="bold">竹語・廣零散 ── 本地歷史時光機 (Local History Diff)</text>
    <circle cx="324" cy="11" r="3" fill="#b8bb26" />
  </g>

  <!-- 右側快速觸發按鈕 -->
  <g transform="translate(680, 16)">
    <rect x="0" y="0" width="174" height="24" rx="4" fill="#fe8019" />
    <use href="#bamboo-mark" x="8" y="3" width="18" height="18" />
    <text x="30" y="16" fill="#1d2021" font-size="11" font-weight="bold">歷史時光機 (Local History)</text>
  </g>

  <!-- ==================== 工作區外層容器 (坐標固定在 X:30, Y:56) ==================== -->
  <g transform="translate(30, 56)">
    
    <!-- ==================== ★★★ 核心展示：雙欄 Git-Style Diff 時光機面板 ★★★ ==================== -->
    <g class="modal-history">
      <rect x="0" y="0" width="820" height="394" rx="8" fill="#1d2021" stroke="#fabd2f" stroke-width="1.4" />
      
      <!-- 面板頂部工具列 -->
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 812 0 C 816.42 0 820 3.58 820 8 L 820 36 L 0 36 Z" fill="#282828" />
      <line x1="0" y1="36" x2="820" y2="36" stroke="#3c3836" stroke-width="1" />
      
      <use href="#bamboo-mark" x="12" y="9" width="18" height="18" />
      <text x="36" y="23" fill="#fabd2f" font-size="12" font-weight="bold">版本對比 (Side-by-Side Diff) ── 隨時無損時光倒流</text>
      <text x="590" y="23" fill="#a89984" font-size="11">免 Git・毫秒級快照保護</text>

      <!-- ==================== 左側：快照時間軸 (Timeline Sidebar, 寬度 230) ==================== -->
      <g transform="translate(12, 46)">
        <rect x="0" y="0" width="220" height="336" rx="6" fill="#282828" stroke="#3c3836" stroke-width="1" />
        <text x="12" y="22" fill="#ebdbb2" font-size="11" font-weight="bold">📜 快照時間軸 (Timeline)</text>
        
        <!-- 時間軸垂直引導線 -->
        <line x1="24" y1="42" x2="24" y2="300" stroke="#504945" stroke-width="1.5" stroke-dasharray="3,3" />

        <!-- 快照節點 1：Pre-AI 煉丹前快照 (當前選中高亮！) -->
        <g transform="translate(12, 38)">
          <rect x="0" y="0" width="196" height="54" rx="4" fill="#1d2021" stroke="#fabd2f" stroke-width="1.2" />
          <circle cx="12" cy="18" r="4" fill="#fabd2f" />
          <use href="#bamboo-mark" x="22" y="8" width="16" height="16" />
          <text x="42" y="20" fill="#fabd2f" font-size="10.5" font-weight="bold">Pre-AI 煉丹前快照</text>
          <text x="42" y="38" fill="#d3869b" font-size="9.5">10:15:20 (自動保留手稿)</text>
        </g>

        <!-- 快照節點 2：定時自動快照 -->
        <g transform="translate(12, 102)">
          <rect x="0" y="0" width="196" height="48" rx="4" fill="#1d2021" stroke="#3c3836" />
          <circle cx="12" cy="18" r="3.5" fill="#a89984" />
          <text x="24" y="20" fill="#ebdbb2" font-size="10">⏱️ 定時自動備份</text>
          <text x="24" y="36" fill="#a89984" font-size="9.5">09:42:11 (已存檔)</text>
        </g>

        <!-- 快照節點 3：手動里程碑標籤 -->
        <g transform="translate(12, 160)">
          <rect x="0" y="0" width="196" height="48" rx="4" fill="#1d2021" stroke="#3c3836" />
          <circle cx="12" cy="18" r="3.5" fill="#8ec07c" />
          <text x="24" y="20" fill="#ebdbb2" font-size="10">🏷️ 里程碑 V1.0</text>
          <text x="24" y="36" fill="#8ec07c" font-size="9.5">08:30:00 (核心規格確認)</text>
        </g>
      </g>

      <!-- ==================== 右側：Side-by-Side 雙欄 Diff 區域 (寬度 564) ==================== -->
      <g class="diff-reveal" transform="translate(244, 46)">
        <rect x="0" y="0" width="564" height="294" rx="6" fill="#1d2021" stroke="#3c3836" stroke-width="1" />
        
        <!-- 雙欄表頭 -->
        <path d="M 0 6 C 0 2.68 2.68 0 6 0 L 558 0 C 561.32 0 564 2.68 564 6 L 564 28 L 0 28 Z" fill="#282828" />
        <line x1="0" y1="28" x2="564" y2="28" stroke="#3c3836" stroke-width="1" />
        <line x1="282" y1="0" x2="282" y2="294" stroke="#3c3836" stroke-width="1" />

        <!-- 左欄標題：歷史快照 -->
        <text x="12" y="19" fill="#fb4934" font-size="11" font-weight="bold">⏪ 歷史快照 (10:15:20 原始手稿)</text>

        <!-- 右欄標題：當前編輯內容 -->
        <text x="294" y="19" fill="#b8bb26" font-size="11" font-weight="bold">📝 當前狀態 (目前編輯中草稿)</text>

        <!-- 雙欄程式碼 / 文字比對內容 -->
        <g transform="translate(10, 42)">
          <!-- 第 1 行 (未更動) -->
          <text x="0" y="10" fill="#a89984" font-size="11">1  # 開發架構速記</text>
          <text x="282" y="10" fill="#a89984" font-size="11">1  # 開發架構速記</text>

          <!-- 第 2 行 (左側刪除紅色高亮 - ) -->
          <g transform="translate(0, 22)">
            <rect x="-4" y="-11" width="270" height="20" fill="#cc241d" fill-opacity="0.2" rx="2" />
            <text x="0" y="4" fill="#fb4934" font-size="11">- 2  開會提到後端要快</text>
          </g>
          <!-- 第 2 行 (右側新增綠色高亮 + ) -->
          <g transform="translate(282, 22)">
            <rect x="-4" y="-11" width="270" height="20" fill="#b8bb26" fill-opacity="0.2" rx="2" />
            <text x="0" y="4" fill="#b8bb26" font-size="11">+ 2  【🎯 核心概要】後端限制 300ms</text>
          </g>

          <!-- 第 3 行 (左側保留原話) -->
          <g transform="translate(0, 46)">
            <text x="0" y="4" fill="#fabd2f" font-size="11">  3  「老陳說：換頁不要跳新視窗」</text>
          </g>
          <!-- 第 3 行 (右側綠色標記保留原話) -->
          <g transform="translate(282, 46)">
            <rect x="-4" y="-11" width="270" height="20" fill="#fe8019" fill-opacity="0.15" rx="2" />
            <text x="0" y="4" fill="#fabd2f" font-size="11">+ 3  【💬 原話】「老陳說：換頁不要...」</text>
          </g>

          <!-- 第 4 行 (右側新增行動待辦) -->
          <g transform="translate(282, 70)">
            <rect x="-4" y="-11" width="270" height="20" fill="#b8bb26" fill-opacity="0.2" rx="2" />
            <text x="0" y="4" fill="#b8bb26" font-size="11">+ 4  - [x] 完成單一視窗分頁攔截</text>
          </g>

          <!-- 第 5 行 -->
          <g transform="translate(0, 94)">
            <text x="0" y="4" fill="#a89984" font-size="11">  4  TODO: 加入 Saga 補償機制</text>
            <text x="282" y="4" fill="#a89984" font-size="11">  5  - [ ] 部署 Saga 一鍵散丹回退棧</text>
          </g>
        </g>

        <!-- 底部統計欄位 (Additions & Deletions) -->
        <g transform="translate(10, 260)">
          <rect x="0" y="0" width="140" height="22" rx="3" fill="#282828" />
          <text x="8" y="15" fill="#b8bb26" font-size="10.5" font-weight="bold">+3 additions</text>
          <text x="76" y="15" fill="#fb4934" font-size="10.5" font-weight="bold">-1 deletion</text>
        </g>
      </g>

      <!-- ==================== 右下角操作按鈕列 (全局中心坐標 X: 30+580+130=740, Y: 56+350+17=423) ==================== -->
      <g transform="translate(560, 348)">
        <!-- ★ 一鍵無損還原按鈕 (核心點擊目標：中心坐標 X: 710, Y: 412) ★ -->
        <rect x="0" y="0" width="248" height="34" rx="5" fill="#fe8019" />
        <use href="#bamboo-icon" x="12" y="7" width="20" height="20" />
        <text x="38" y="22" fill="#1d2021" font-size="12" font-weight="bold">⏪ 一鍵還原至此歷史版本</text>
      </g>
    </g>
  </g>

  <!-- ==================== 階段 6：還原成功反饋提示 ==================== -->
  <g class="revert-success" transform="translate(260, 170)">
    <rect x="0" y="0" width="360" height="140" rx="8" fill="#1d2021" stroke="#fabd2f" stroke-width="2" filter="url(#winShadow)" />
    <use href="#bamboo-icon" x="160" y="22" width="40" height="40" />
    <text x="180" y="85" text-anchor="middle" fill="#fabd2f" font-size="15" font-weight="bold">🎉 已 100% 無損還原成功！</text>
    <text x="180" y="110" text-anchor="middle" fill="#ebdbb2" font-size="11.5">內容已完整退回至「Pre-AI 煉丹前快照」狀態</text>
  </g>

  <!-- ==================== 模擬游標 (精確鎖定按鈕點擊) ==================== -->
  <g class="mouse-history">
    <path d="M 0 0 L 0 16 L 4.5 12.5 L 8 19 L 10.5 17.5 L 7 11.5 L 12.5 11.5 Z" fill="#fbf1c7" stroke="#1d2021" stroke-width="1.2" />
  </g>
</svg>
